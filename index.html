body{font-family:"Zen Maru Gothic",-apple-system,sans-serif;background:linear-gradient(170deg,#FFF3E6,#FAF0E0 50%,#F7E3CE);color:#4A3E35;min-height:100vh}

.f{background:#fff;border-radius:14px;padding:12px 16px;font-weight:900;font-size:15px;box-shadow:0 6px 18px rgba(180,140,90,.13)}
.f b{color:#F08C6C}
.cta{display:inline-block;background:linear-gradient(135deg,#F08C6C,#F6B26B);color:#fff;font-weight:900;font-size:17px;padding:16px 36px;border-radius:999px;text-decoration:none;box-shadow:0 12px 26px rgba(240,140,108,.45)}

.ph{width:290px;border-radius:34px;box-shadow:0 30px 70px rgba(160,110,60,.3);border:9px solid #fff}

<div class="wrap">
